<body class="landing-page is-loading">
  <script>
    (function () {
      var shouldSettle = false;

      try {
        shouldSettle = Boolean(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
      } catch (error) {
        /* Show the final page if the accessibility preference cannot be read. */
        shouldSettle = true;
      }

      try {
        var params = new URL(window.location.href).searchParams;
        var performanceObject = window.performance;
        var navigation = performanceObject && performanceObject.getEntriesByType
          ? performanceObject.getEntriesByType("navigation")[0] : null;
        var navigationType = navigation && navigation.type;
        if (!navigationType && performanceObject && performanceObject.navigation) {
          if (performanceObject.navigation.type === 1) navigationType = "reload";
          else if (performanceObject.navigation.type === 2) navigationType = "back_forward";
        }
        shouldSettle = shouldSettle || navigationType === "back_forward"
          || (navigationType !== "reload" && params.get("skip-intro") === "1");
      } catch (error) {
        /* The regular boot path will resolve the state below. */
      }

      /* Home links skip once. Refresh always assembles, even before the skip
         query is cleaned up. History restores show the finished composition. */

      document.body.classList.remove("is-loading");
      document.body.classList.add("is-home-settled");
      window.__shpWoodIntroRequested = !shouldSettle;
      document.body.dataset.woodState = shouldSettle ? "settled" : "pending";
      if (shouldSettle) document.body.classList.add("is-home-return");
      if (!shouldSettle) {
        document.body.classList.add("wood-intro-pending");
        window.__shpWoodIntroFailOpen = function () {
          if (window.__shpWoodIntroRecoveryTimer != null) {
            window.clearTimeout(window.__shpWoodIntroRecoveryTimer);
            window.__shpWoodIntroRecoveryTimer = null;
          }
          if (window.__shpWoodIntroRecoveryCleanup) {
            window.__shpWoodIntroRecoveryCleanup();
            window.__shpWoodIntroRecoveryCleanup = null;
          }
          window.__shpWoodIntroRequested = false;
          if (window.SHPWoodLoader) {
            window.SHPWoodLoader.finish();
          } else {
            document.body.classList.remove("wood-intro-pending", "wood-intro-running");
            document.body.dataset.woodState = "settled";
          }
        };
        /* A tiny controller may arrive slowly without losing the intro. Count
           hard-stall recovery only while the page is visible, so a background
           tab cannot consume its first-view animation before activation. */
        var armRecovery = function () {
          if (document.hidden) return;
          if (!window.__shpWoodIntroFailOpen || window.__shpWoodIntroRecoveryTimer != null) return;
          window.__shpWoodIntroRecoveryTimer = window.setTimeout(function () {
            window.__shpWoodIntroRecoveryTimer = null;
            if (document.hidden) return;
            if (window.__shpWoodIntroFailOpen) window.__shpWoodIntroFailOpen();
          }, 10000);
        };
        var onRecoveryVisibilityChange = function () {
          if (document.hidden) {
            window.clearTimeout(window.__shpWoodIntroRecoveryTimer);
            window.__shpWoodIntroRecoveryTimer = null;
          } else {
            armRecovery();
          }
        };
        window.__shpWoodIntroRecoveryCleanup = function () {
          document.removeEventListener("visibilitychange", onRecoveryVisibilityChange);
        };
        document.addEventListener("visibilitychange", onRecoveryVisibilityChange);
        armRecovery();
      }
    })();
  </script>

  <script>
    /* Slow delivery must not cancel a requested intro. Fail open only when the
       parser-blocking controller actually failed to define itself. */
    if (!window.SHPWoodLoader && window.__shpWoodIntroFailOpen) {
      window.__shpWoodIntroFailOpen();
    }
    if (window.__shpWoodIntroRecoveryCleanup) {
      window.__shpWoodIntroRecoveryCleanup();
      window.__shpWoodIntroRecoveryCleanup = null;
    }
    window.__shpWoodIntroFailOpen = null;
  </script>
